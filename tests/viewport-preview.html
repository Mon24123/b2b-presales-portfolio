<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>售前作品集尺寸检查</title><style>*{box-sizing:border-box}body{margin:0;background:#dfe5e6;font-family:sans-serif}.bar{position:sticky;top:0;z-index:2;padding:10px;background:white;border-bottom:1px solid #bbb}.bar button{margin-right:8px;padding:8px 14px}.label{padding:10px 14px}.stage{margin:8px auto 40px;background:white}.stage iframe{display:block;width:100%;height:760px;border:0}</style></head><body><div class="bar"><button data-w="320">320</button><button data-w="390">390</button><button data-w="430">430</button><button data-w="768">768</button><button data-w="1024">1024</button><button data-w="1440">1440</button></div><div class="label">390 × 760</div><div class="stage" style="width:390px"><iframe src="../dist/"></iframe></div><script>const stage=document.querySelector('.stage');const label=document.querySelector('.label');document.querySelectorAll('button').forEach(b=>b.onclick=()=>{stage.style.width=b.dataset.w+'px';label.textContent=b.dataset.w+' × 760'});</script></body></html>
